[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resoverse-commons"
version = "0.2.0"
description = "Open validation contracts for governed ResoVerse capabilities"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema==4.25.1"]

[project.scripts]
resoverse-commons = "resoverse_commons.cli:main"

[tool.setuptools]
packages = ["resoverse_commons"]

[tool.setuptools.package-data]
resoverse_commons = ["corpus/*.json"]
