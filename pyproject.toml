[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resoverse-commons"
version = "0.1.0"
description = "Open validation contracts for governed ResoVerse capabilities"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
resoverse-commons = "resoverse_commons.cli:main"

[tool.setuptools]
packages = ["resoverse_commons"]

