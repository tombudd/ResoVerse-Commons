name: Trusted main validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development checks
        run: python -m pip install -e .
      - name: Require Draft 2020-12 checker
        run: python -c 'from jsonschema import Draft202012Validator'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate safe example
        run: python -m resoverse_commons.cli validate examples/local-metadata-reader/capability.json
      - name: Require unsafe example to hold
        run: |
          set +e
          python -m resoverse_commons.cli validate examples/adversarial-unsafe-capability/capability.json
          status=$?
          test "$status" -eq 2
      - name: Verify release inventory
        run: shasum -a 256 -c RELEASE_MANIFEST.sha256
