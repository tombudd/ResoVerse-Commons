name: Trusted main validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout trusted tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development checks
        run: python -m pip install -e .
      - name: Require Draft 2020-12 checker
        run: python -c 'from jsonschema import Draft202012Validator'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run cross-language conformance corpus
        run: python -m resoverse_commons.cli conformance
      - name: Validate safe example
        run: python -m resoverse_commons.cli validate examples/local-metadata-reader/capability.json
      - name: Require unsafe example to hold
        run: >-
          python -c "import subprocess, sys;
          result = subprocess.run([sys.executable, '-m', 'resoverse_commons.cli',
          'validate', 'examples/adversarial-unsafe-capability/capability.json']);
          raise SystemExit(0 if result.returncode == 2 else 1)"
      - name: Verify release inventory
        run: python tools/verify_release_manifest.py

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - name: Build wheel without runtime dependencies
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/resoverse-wheel-smoke
          /tmp/resoverse-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/resoverse-wheel-smoke/bin/resoverse-commons --help
          /tmp/resoverse-wheel-smoke/bin/resoverse-commons conformance

  javascript-conformance:
    name: Experimental JavaScript conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Run shared corpus independently
        run: node implementations/javascript/conformance.mjs
