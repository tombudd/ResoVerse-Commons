name: Non-executing pull request boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  inspect:
    name: Inspect changed files without execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public boundary and JSON syntax
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pull = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const failures = [];
            const notices = [];
            const protectedPrefixes = [".github/workflows/"];
            const textLimit = 256 * 1024;
            const forbidden = [
              [/(^|[^A-Za-z0-9])UNA-?1([^A-Za-z0-9]|$)/i, "private-system identifier"],
              [/\/Users\/[A-Za-z0-9._-]+\//, "local absolute path"],
              [/-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/, "private key material"],
            ];

            if (files.length > 100) {
              failures.push("More than 100 changed files; split the contribution for bounded review.");
            }

            for (const file of files) {
              const changedNames = [file.filename, file.previous_filename].filter(Boolean);
              if (changedNames.some((name) => protectedPrefixes.some((prefix) => name.startsWith(prefix)))) {
                failures.push(`${file.filename}: workflow changes require a separate maintainer-owned review.`);
              }
              if (file.status === "removed") continue;

              let rawUrl;
              try {
                rawUrl = new URL(file.raw_url);
              } catch (error) {
                failures.push(`${file.filename}: GitHub did not provide a valid raw content URL.`);
                continue;
              }
              if (rawUrl.protocol !== "https:" || rawUrl.hostname !== "github.com") {
                failures.push(`${file.filename}: raw content URL is outside the expected GitHub origin.`);
                continue;
              }

              const response = await fetch(rawUrl, { redirect: "follow" });
              if (!response.ok) {
                failures.push(`${file.filename}: public raw content returned HTTP ${response.status}.`);
                continue;
              }
              const finalUrl = new URL(response.url);
              if (finalUrl.protocol !== "https:" || !["github.com", "raw.githubusercontent.com"].includes(finalUrl.hostname)) {
                failures.push(`${file.filename}: raw content redirected outside trusted GitHub origins.`);
                continue;
              }
              const declaredLength = Number(response.headers.get("content-length"));
              if (Number.isFinite(declaredLength) && declaredLength > textLimit) {
                failures.push(`${file.filename}: exceeds the 256 KiB non-executing inspection limit.`);
                continue;
              }

              const chunks = [];
              let received = 0;
              let oversized = false;
              for await (const chunk of response.body) {
                received += chunk.length;
                if (received > textLimit) {
                  oversized = true;
                  break;
                }
                chunks.push(Buffer.from(chunk));
              }
              if (oversized) {
                failures.push(`${file.filename}: exceeds the 256 KiB non-executing inspection limit.`);
                continue;
              }
              const bytes = Buffer.concat(chunks, received);
              if (bytes.includes(0)) {
                failures.push(`${file.filename}: binary content requires separate maintainer review.`);
                continue;
              }
              const text = bytes.toString("utf8");
              if (text.includes("\uFFFD")) {
                failures.push(`${file.filename}: is not valid UTF-8 text.`);
                continue;
              }

              for (const [pattern, label] of forbidden) {
                if (pattern.test(text)) failures.push(`${file.filename}: contains ${label}.`);
              }

              if (file.filename.endsWith(".json")) {
                try {
                  JSON.parse(text);
                } catch (error) {
                  failures.push(`${file.filename}: invalid JSON (${error.message}).`);
                }
              }
            }

            notices.push(`Inspected ${files.length} changed file(s) without checkout or execution.`);
            notices.push("This check does not approve a capability, verify contributor identity, or replace independent review.");
            for (const notice of notices) core.notice(notice);
            if (failures.length) core.setFailed(failures.join("\n"));
